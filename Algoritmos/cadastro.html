 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body class="pagina-cadastro-trunkland">
    <div class="tela">
   <div class="cadastro-card">
 <h1>Faça seu cadastro e seja membro de Trunkland</h1>
    <label for="ipt_nome">Insira seu nome de Usuário</label>
    <input placeholder="Insira sua senha de Usuário" id="ipt_nome"><br><br>
    <label for="ipt_nacao">Insira seu país de origem</label>
    <input placeholder="Insira o nome da sua nação" id="ipt_nacao"><br><br>
    <label for="ipt_email">Insira seu email</label>
    <input placeholder="Insira seu email" id="ipt_email"><br><br>
    <label for="ipt_senha">Insira sua senha</label>
    <input placeholder="Insira sua senha" id="ipt_senha"><br><br>
    <label for="ipt_senha2">Insira sua senha novamente</label>
    <input placeholder="Insira sua senha novamente" id="ipt_senha2"><br><br>
    <h2>Faça sua escolha de nação</h2>
    <label for="ipt_reino">Escolha o reino/republica que se indentifica</label>
    <select name="reino" id="ipt_reino">
       <option value="flores">Reino das Flores(RF)</option>
       <option value="gelo">Reino Gelado(RG)</option>
       <option value="risos">Reino da Diversão(RD)</option>
       <option value="reino esquecido">Reino Esquecido(RE)</option>
       <option value="quebrada">Republica Quebrada(RQ)</option>
       <option value="sol">Reino do Sol(RS)</option>
      </select><br>
    <label for="ipt_federado">Escolha seu reino federado/republica</label>
    <select name="federado" id="ipt_federado">
       <option value="ruzis">Reino Ruzis(RF)</option>
       <option value="antiga">Terra Antiga(RF)</option>
       <option value="scands">Terras Scands(RF)</option>
       <option value="prolan">Terra dos Lagos</option>
       <option value="rume">Vice Reino Rumé(RF)</option>
       <option value="colquidas">Terras Colquidas(RF)</option>
       <option value="bulues">Território de Bulues(RF)</option>
       <option value="magerlon">Reino Magermon(RF)</option>
       <option value="franbator">Reino Franbator(RF)</option>
       <option value="ibekers">Reino Ibeker(RF)</option>
       <option value="itrapafor">Reino Itrapafor(RF)</option>
       <option value="capital">Reino Capital(RF)</option>
       <option value="purtolian">Ducado de Purtolian(RG)</option>
       <option value="ottivenia">Reino de Ottivenia(RG)</option>
       <option value="sul">Ducado do Sul(RG)</option>
       <option value="oceano">Reino do Oceano(RG)</option>
       <option value="mexquerzim">Reino Mexquerzim(RD)</option>
       <option value="pratiado">Reino Pratiado(RD)</option>
       <option value="grandemor">Grão Grandemor(RD)</option>
       <option value="conpelivia">Ducado da Conpelivia(RD)</option>
       <option value="chisgard">Reino Chisgard(RD)</option>
       <option value="afregarbat">Reino de Afregarbat(RE)</option>
       <option value="obscure">Floresta Obscure Kriedtch(RQ)</option>
       <option value="psisvânia">Reino da Psisvânia(RQ)</option>
       <option value="numitania">Republica Numitania(RQ)</option>
       <option value="soloriental">Republica Soloriental(RQ)</option>
       <option value="nejtodord">Reino Nejtodord(RQ)</option>
       <option value="qagard">Republica Qagard(RQ)</option>
       <option value="esteptans">Republica Esteptans(RQ)</option>
       <option value="javasia">Republica da Javasia(RS)</option>
       <option value="josol">Reino Josol(RS)</option>
       <option value="japtain">Reino Japtain(RS)</option>
       <option value="indrialom">Reino indrialom(RS)</option>
       <option value="mandoghuan">Reino Mandoghuan(RS)</option>
       <option value="filbior">Reino Filbior(RS)</option>
      </select><br>
    <label for="ipt_cla">Escolha o clã que se indentifica</label>
    <select name="cla" id="ipt_cla">
      <option value="ortgorods">Ortgorods</option>
      <option value="primoders">Primoders</option>
      <option value="copquerkirs">Copquerkirs</option>
      <option value="provelenians">Provelenians</option>
      <option value="angardons">Angardons</option>
      <option value="batars">Batars</option>
      <option value="Pentzeradins">Pentzeradins</option>
      <option value="lutivins">Lutivins</option>
      <option value="Preskalians">Preskalians</option>
      <option value="Metdalons">Metdalons</option>
      <option value="catepoleris">Catepoleris</option>
      <option value="">Isthelins</option>
    </select>
    <div class="botao">
    <button onclick="Cadastrar()">Cadastrar</button>
    <div id="div_msg"></div>
    </div>
    </div>
    </div>
 </body>
 </html>

 <script>
   function Cadastrar(){
      let reinos = [
      "Reino das Flores",
      "Reino do Gelo",
      "Reino dos Risos",
      "Reino Esquecido",
      "Reino Quebrado",
      "Reino do Sol"
      ];

      for (let i = 0; i < reinos.length; i++) {
      div_msg.innerHTML += `<option value="${reinos[i]}">${reinos[i]}</option>`;
      }
   }

 </script>
